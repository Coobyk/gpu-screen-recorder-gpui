name: Release

# Builds on every push/PR (so the build stays green). Every push to `main`
# bumps the patch version, commits it, tags it and publishes a GitHub Release
# plus both AUR packages; a `v*` tag push or a manual run releases the version
# already in Cargo.toml instead.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A push to main starts a bump + release run; a second push that lands while
# that run is still going must not race it for the version bump.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN: gpu-screen-recorder-gpui
  DESKTOP: com.coobyk.gpu_screen_recorder.desktop

jobs:
  # Every push to main gets its own version: the patch number is bumped and
  # committed here, and the rest of the pipeline releases that commit. The tag
  # itself is created only once the Linux build has succeeded (see `linux`), so
  # a failed build never leaves a tag with no release behind.
  bump:
    name: Bump version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Resolve version
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -o errexit -o pipefail -o nounset

          release=false
          if [ "$EVENT" = workflow_dispatch ] || [ "$REF_TYPE" = tag ]; then
            release=true
          fi

          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            # `concurrency` serialises runs for main, but a previous run may
            # still have advanced the branch after this run's commit. Rebase
            # onto it so the bump push cannot be rejected as non-fast-forward.
            git pull --rebase origin main
            case "$(git log -1 --format=%s)" in
              "chore(release): "*)
                # A release commit that triggered a run anyway (e.g. it was
                # pushed with a token that does start workflows): leave it
                # alone instead of bumping and releasing it again.
                ;;
              *)
                version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
                test -n "$version"
                major=${version%%.*}
                rest=${version#*.}
                minor=${rest%%.*}
                patch=${rest#*.}
                patch=${patch%%[^0-9]*}
                next="$major.$minor.$((patch + 1))"

                sed -i "s/^version = \"$version\"/version = \"$next\"/" Cargo.toml
                # The lockfile records the crate's own version too; without
                # this, the later `cargo build --locked` refuses to run.
                cargo update -p gpu-screen-recorder-gpui

                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add Cargo.toml Cargo.lock
                git commit -m "chore(release): v$next"
                git push origin HEAD:main
                release=true
                ;;
            esac
          fi

          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          test -n "$version"
          if [ "$REF_TYPE" = tag ]; then
            tag=$REF_NAME
          else
            tag="v$version"
          fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match Cargo.toml (v$version)"
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "sha=$(git rev-parse HEAD)"
            echo "release=$release"
          } >>"$GITHUB_OUTPUT"

  linux:
    name: Linux x86_64
    needs: bump
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml (v${VERSION})"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libvulkan-dev libegl1 libgl1-mesa-dri

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)"

          # --- portable tarball -------------------------------------------------
          STAGE="${BIN}-${VERSION}-x86_64-linux"
          rm -rf "$STAGE"
          install -Dm755 "target/release/$BIN" "$STAGE/$BIN"
          install -Dm644 "$DESKTOP" "$STAGE/$DESKTOP"
          # All icons, not just the app one: the tray looks up
          # `...tray-idle`/`-recording`/`-paused` by name.
          cp -a icons "$STAGE/"
          install -Dm644 LICENSE README.md "$STAGE/"

          cat > "$STAGE/install.sh" <<'SH'
          #!/bin/sh
          # Install into $PREFIX (default /usr/local).
          set -eu
          here=$(cd "$(dirname "$0")" && pwd)
          prefix=${PREFIX:-/usr/local}
          install -Dm755 "$here/gpu-screen-recorder-gpui" \
            "$prefix/bin/gpu-screen-recorder-gpui"
          install -Dm644 "$here/com.coobyk.gpu_screen_recorder.desktop" \
            "$prefix/share/applications/com.coobyk.gpu_screen_recorder.desktop"
          for f in "$here"/icons/hicolor/scalable/apps/*.svg; do
            install -Dm644 "$f" \
              "$prefix/share/icons/hicolor/scalable/apps/$(basename "$f")"
          done
          echo "Installed to $prefix."
          echo "The 'gpu-screen-recorder' backend must be installed separately."
          SH
          chmod +x "$STAGE/install.sh"
          tar czf "$STAGE.tar.gz" "$STAGE"

          # --- .deb -------------------------------------------------------------
          # Runtime deps are derived from the binary's linkage rather than
          # hard-coded, so they track what the linker actually pulled in.
          DEB="deb"
          rm -rf "$DEB"
          mkdir -p "$DEB/DEBIAN" "$DEB/usr/bin" \
            "$DEB/usr/share/applications" \
            "$DEB/usr/share/icons/hicolor/scalable/apps" \
            "$DEB/usr/share/doc/$BIN"
          install -Dm755 "target/release/$BIN" "$DEB/usr/bin/$BIN"
          install -Dm644 "$DESKTOP" "$DEB/usr/share/applications/$DESKTOP"
          for f in icons/hicolor/scalable/apps/*.svg; do
            install -Dm644 "$f" \
              "$DEB/usr/share/icons/hicolor/scalable/apps/$(basename "$f")"
          done
          install -Dm644 LICENSE "$DEB/usr/share/doc/$BIN/copyright"

          # `readlink -f` first: on merged-/usr systems dpkg records the
          # realpath (/usr/lib/...) and reports "no path found" for /lib/...
          LINK_DEPENDS="$(
            ldd "target/release/$BIN" 2>/dev/null \
              | awk '/=> \// {print $3}' \
              | xargs -r readlink -f \
              | xargs -r dpkg -S 2>/dev/null \
              | cut -d: -f1 | sort -u | grep -v '^$' | paste -sd, - || true
          )"
          # GPUI additionally `dlopen`s these at startup, so the linker never
          # records them; without them the app exits at launch.
          DLOPEN_DEPENDS="libegl1 libvulkan1 libwayland-client0 libwayland-egl1"
          DEPENDS="$(
            { printf '%s\n' "$LINK_DEPENDS" | tr ',' '\n'
              printf '%s\n' $DLOPEN_DEPENDS
            } | sed '/^$/d' | sort -u | paste -sd, -
          )"
          cat > "$DEB/DEBIAN/control" <<EOF
          Package: $BIN
          Version: $VERSION
          Section: video
          Priority: optional
          Architecture: amd64
          Maintainer: Coobyk <mail@coobyk.com>
          Homepage: https://github.com/${GITHUB_REPOSITORY}
          Depends: $DEPENDS
          Description: GPUI frontend for gpu-screen-recorder
           A Rust + GPUI frontend for the gpu-screen-recorder backend, keeping the
           Qt frontend's pages, configuration format and behaviour.
           .
           The gpu-screen-recorder backend must be installed separately.
          EOF
          dpkg-deb --build --root-owner-group "$DEB" "${BIN}_${VERSION}_amd64.deb"

          sha256sum "$STAGE.tar.gz" "${BIN}_${VERSION}_amd64.deb" > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: |
            gpu-screen-recorder-gpui-*.tar.gz
            gpu-screen-recorder-gpui_*.deb
            SHA256SUMS
          if-no-files-found: error

      - name: Publish release
        if: needs.bump.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bump.outputs.version }}
          TAG: ${{ needs.bump.outputs.tag }}
        run: |
          set -euo pipefail

          # The bump job only commits the new version. Creating the tag here,
          # after a successful build, keeps a broken build from leaving a tag
          # without a release. Tag pushes already carry their tag.
          if [ "${GITHUB_EVENT_NAME}" = push ] && [ "${GITHUB_REF}" = refs/heads/main ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          fi

          cat > notes.md <<'EOF'
          Linux (x86_64) build of the GPUI frontend.

          Requires the `gpu-screen-recorder` backend, which is **not** bundled:
          install it from your package manager or from Flathub
          (`com.dec05eba.gpu_screen_recorder`).

          - `*.tar.gz` — unpack and run `./install.sh`, or copy the binary and
            the `.desktop`/icon files into place by hand.
          - `*.deb` — `sudo apt install ./<file>.deb`.
          - `SHA256SUMS` — checksums for the archives.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              gpu-screen-recorder-gpui-*.tar.gz \
              gpu-screen-recorder-gpui_*.deb \
              SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              gpu-screen-recorder-gpui-*.tar.gz \
              gpu-screen-recorder-gpui_*.deb \
              SHA256SUMS \
              --title "GPU Screen Recorder (GPUI) ${VERSION}" \
              --notes-file notes.md
          fi

  # The AUR packages are built from the same tag on Arch itself, so the binary
  # shipped in `gpu-screen-recorder-gpui-bin` is linked against Arch's libraries
  # rather than Ubuntu's.
  aur-build:
    name: Build AUR packages (Arch)
    needs: [bump, linux]
    if: needs.bump.outputs.release == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      SRC_PKG: gpu-screen-recorder-gpui
      VERSION: ${{ needs.bump.outputs.version }}
      TAG: ${{ needs.bump.outputs.tag }}
    steps:
      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Su --noconfirm --needed \
            base-devel git openssh sudo rust pkgconf \
            fontconfig freetype2 libx11 libxcb libxkbcommon libxkbcommon-x11 \
            wayland libglvnd vulkan-icd-loader libxau libxdmcp \
            pacman-contrib libarchive
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0

      - name: Resolve tag commit time
        id: meta
        run: |
          set -o errexit -o pipefail -o nounset
          # Captured while the checkout is still owned by root; the build user
          # takes ownership of it in the next step.
          echo "epoch=$(git log -1 --format=%ct "$TAG")" >>"$GITHUB_OUTPUT"

      - name: Build package with makepkg
        run: |
          set -o errexit -o pipefail -o nounset
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE/packaging/aur/$SRC_PKG"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          # The tag tarball only exists once the release has been tagged, so
          # its checksum cannot be committed ahead of time on a bump-per-push
          # release. Compute it here, before makepkg validates the sources.
          sudo -u builder -H updpkgsums
          sudo -u builder -H makepkg --force --nodeps --noconfirm
          ls -l ./*.pkg.tar.zst

      - name: Assemble release artifacts
        env:
          EPOCH: ${{ steps.meta.outputs.epoch }}
        run: |
          set -o errexit -o pipefail -o nounset
          cd "$GITHUB_WORKSPACE"
          pkg=$(find "packaging/aur/$SRC_PKG" -maxdepth 1 -name '*.pkg.tar.zst' ! -name '*-debug-*' -print -quit)
          test -n "$pkg"
          mkdir -p dist tree
          cp "$pkg" dist/
          bsdtar -xf "$pkg" -C tree --exclude .PKGINFO --exclude .BUILDINFO --exclude .MTREE
          if ldd tree/usr/bin/gpu-screen-recorder-gpui | grep -q 'not found'; then
            echo "::error::binary has unresolved shared library dependencies"
            ldd tree/usr/bin/gpu-screen-recorder-gpui
            exit 1
          fi
          # Deterministic tarball: re-running the workflow for the same tag
          # yields the same checksum, so `-bin` does not churn.
          tar --sort=name --mtime="@$EPOCH" --owner=0 --group=0 --numeric-owner \
            -czf "dist/gpu-screen-recorder-gpui-$VERSION-x86_64-archlinux.tar.gz" -C tree .
          cd dist
          # Distinct name: the Ubuntu job owns `SHA256SUMS`.
          sha256sum ./* >SHA256SUMS.arch
          cat SHA256SUMS.arch

      - uses: actions/upload-artifact@v7
        with:
          name: arch-packages
          path: dist/*
          if-no-files-found: error

  aur-publish:
    name: Publish AUR packages
    needs: [bump, linux, aur-build]
    if: needs.bump.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.bump.outputs.tag }}
      VERSION: ${{ needs.bump.outputs.version }}
      SRC_PKG: gpu-screen-recorder-gpui
      BIN_PKG: gpu-screen-recorder-gpui-bin
    steps:
      # Pin the exact commit that was built (the version-bump commit on main,
      # or the tag commit): the packaging files must match the release.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: arch-packages
          path: dist

      - name: Attach Arch packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber

      - name: Point source PKGBUILD at ${{ needs.bump.outputs.version }}
        run: bash packaging/aur/bump-pkgver.sh "$SRC_PKG" "$VERSION" "packaging/aur/$SRC_PKG/PKGBUILD"

      - name: Push ${{ env.SRC_PKG }}
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: gpu-screen-recorder-gpui
          pkgbuild: ./packaging/aur/gpu-screen-recorder-gpui/PKGBUILD
          updpkgsums: true
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ needs.bump.outputs.tag }}"

      - name: Point -bin PKGBUILD at ${{ needs.bump.outputs.version }}
        run: bash packaging/aur/bump-pkgver.sh "$BIN_PKG" "$VERSION" "packaging/aur/$BIN_PKG/PKGBUILD"

      - name: Push ${{ env.BIN_PKG }}
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: gpu-screen-recorder-gpui-bin
          pkgbuild: ./packaging/aur/gpu-screen-recorder-gpui-bin/PKGBUILD
          updpkgsums: true
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ needs.bump.outputs.tag }}"
