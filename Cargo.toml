[package]
name = "gpu-screen-recorder-gpui"
version = "5.7.12"
edition = "2024"
description = "A GPUI frontend for gpu-screen-recorder"
license = "GPL-3.0-only"
readme = "README.md"

[[bin]]
name = "gpu-screen-recorder-gpui"
path = "src/main.rs"

[dependencies]
# GPUI, the GPU-accelerated UI framework from Zed, via its maintained
# standalone release (`gpui-unofficial`), imported as `gpui`.
gpui = { package = "gpui-unofficial", version = "=1.24.2" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.24.2" }

# Text input grapheme handling.
unicode-segmentation = "1.12"

# Signals (SIGINT/SIGUSR1/SIGUSR2) and prctl for the recorder child process.
libc = "0.2"

# System tray (StatusNotifierItem). `async-io` must match zbus' runtime and
# `tokio` (ksni's default) must be off so the two do not collide.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

# D-Bus client for the org.freedesktop.portal.GlobalShortcuts portal.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
zvariant = "5"

[profile.release]
opt-level = 2
